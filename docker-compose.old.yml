version: '3'
services:
  backend:
    image: my-spring-boot-app:latest
    ports:
      - "8080:8080"
    # VẤN ĐỀ: Docker bind vào 0.0.0.0:8080
    # → Port 8080 public ra internet, bypass hoàn toàn UFW!
    # Dù UFW có rule "deny 8080", Docker tự thêm iptables rule ACCEPT
    # trước khi UFW kiểm tra, khiến cổng 8080 vẫn truy cập được từ ngoài
